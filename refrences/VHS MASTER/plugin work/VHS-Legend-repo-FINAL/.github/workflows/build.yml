name: Windows Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          if (-not $env:AE_SDK_ROOT) {
            Write-Error "AE_SDK_ROOT is not configured. Install/provide the Adobe After Effects SDK on the runner."
          }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DAE_SDK_ROOT=$env:AE_SDK_ROOT"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Collect AEX
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-ChildItem -Path build -Recurse -Filter *.aex | Copy-Item -Destination artifacts -Force

      - name: Upload AEX
        uses: actions/upload-artifact@v4
        with:
          name: aex-build
          path: artifacts/*.aex
